name: Persistence authority tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  persistence:
    name: Disposable database authority suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: bantabato_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BANTABATO_TEST_MODE: "1"
      BANTABATO_TEST_DATABASE_NAME: bantabato_test
      BANTABATO_TEST_DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/bantabato_test
      BANTABATO_PERSISTENCE_CI: "1"
      BANTABATO_PERSISTENCE_RESULT_FILE: artifacts/persistence-results.json
      BANTABATO_COMPARISON_RESULT_FILE: artifacts/comparison-results.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply committed Drizzle schema to disposable test database
        env:
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/bantabato_test
        run: pnpm exec drizzle-kit push --force
      - name: Run persistence authority suite
        run: env -u DATABASE_URL pnpm test:persistence
      - name: Upload persistence result artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bantabato-persistence-results
          path: artifacts/*.json
          if-no-files-found: error
